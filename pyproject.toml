[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ft_utils"
version = "0.2.0"
authors = [
  { name="Meta Platforms, Inc.", email="open-source@fb.com" },
]
description = "A utility library for Free Threaded Python programming"
readme = "README.md"
requires-python = ">=3.13"
keywords = ["free-threading", "nogil", "concurrency", "threading", "atomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Software Development :: Libraries",
]
# PEP 639 SPDX expression. Do not add a "License ::" classifier alongside this;
# setuptools >= 77 rejects using both.
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/facebookincubator/ft_utils"
Issues = "https://github.com/facebookincubator/ft_utils/issues"
Documentation = "https://github.com/facebookincubator/ft_utils/blob/main/docs/index.md"

[tool.setuptools]
packages = ["ft_utils", "ft_utils.tests"]

[tool.setuptools.package-data]
# Compiled extensions are placed by ext_modules; globbing "*.so" here would
# bundle stale local build artifacts and never match Windows ".pyd".
ft_utils = ["*.pyi", "py.typed"]
"ft_utils.tests" = ["*.pyi"]

[tool.cibuildwheel]
# The set of interpreters we publish. cp313t/cp314t come from the
# free-threading enable below.
build = ["cp313-*", "cp314-*"]
# 3.13 free-threading is still an opt-in variant on the cibuildwheel 3.x line.
# Keep the pin on 3.x: 4.x removes cp313t builds entirely.
enable = ["cpython-freethreading"]
test-command = "python -m ft_utils.tests.test_run_all"
build-verbosity = 1

[tool.cibuildwheel.macos]
# macOS runners are Apple Silicon; we do not publish Intel wheels.
archs = ["arm64"]
