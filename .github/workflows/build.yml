name: Build and Test

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# cibuildwheel builds and tests every wheel we publish. Which interpreters that
# covers is declared in [tool.cibuildwheel] in pyproject.toml, so the matrix
# below only picks the runners: cibuildwheel builds natively, and each
# architecture needs a host of its own.

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build sdist
        run: python -m build --sdist --outdir dist

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: Build wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # linux x86_64 + i686
          - ubuntu-24.04-arm   # linux aarch64
          - windows-latest     # win_amd64
          - macos-latest       # macosx arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned to the 3.x line; see the note by "enable" in pyproject.toml.
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.1

      - name: Build Python wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload Python wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish-to-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs:
      - sdist
      - wheels
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ft_utils
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -lR dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - sdist
      - wheels
    environment:
      name: pypi
      url: https://pypi.org/p/ft_utils
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -lR dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - publish-to-pypi

    permissions:
      contents: write
      id-token: write

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true

    - name: Sign distributions
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: ./dist/*.whl ./dist/*.tar.gz

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        "$GITHUB_REF_NAME"
        --repo "$GITHUB_REPOSITORY"
        --notes ""

    - name: Upload artifacts
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release upload
        "$GITHUB_REF_NAME" dist/**
        --repo "$GITHUB_REPOSITORY"
